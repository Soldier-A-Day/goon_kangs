        <text x="382" y="30" fill="#7FAECF" text-anchor="end" font-family="ui-monospace, Menlo, monospace">보온 +2</text></g>
      <g transform="translate(0,312)"><rect width="400" height="70" fill="#191D14" stroke="#333A2B"/>
        <text x="18" y="30" fill="#99A18D" font-size="13">수족</text><text x="18" y="54" fill="#DFE2D6">방한화 · 장갑</text>
        <text x="382" y="30" fill="#7FAECF" text-anchor="end" font-family="ui-monospace, Menlo, monospace">보온 +2</text></g>
      <g transform="translate(0,390)"><rect width="400" height="70" fill="#191D14" stroke="#333A2B"/>
