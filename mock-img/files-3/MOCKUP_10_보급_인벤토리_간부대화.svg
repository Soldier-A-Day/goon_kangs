  <rect x="976" y="0" width="240" height="48" fill="#9AB06F"/>
  <text x="1096" y="31" fill="#12150F" font-size="17" font-weight="800" text-anchor="middle">청구 확정</text>
</g>

<!-- ══════════ 2 : 인벤토리 · 피복 ══════════ -->
<g transform="translate(0,760)">
  <text x="60" y="46" fill="#5E6E42" font-size="12" letter-spacing="3" font-family="ui-monospace, Menlo, monospace">SCREEN 7.10-B — 인벤토리 · 피복 [I]</text>

  <rect x="320" y="70" width="1280" height="640" fill="#12150F"/>
  <rect x="320" y="70" width="1280" height="640" fill="none" stroke="#333A2B" stroke-width="2"/>
