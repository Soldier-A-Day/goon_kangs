    <g><circle cx="830" cy="112" r="9" fill="#6E7A50"/><text x="830" y="142" fill="#99A18D" font-size="13" text-anchor="middle">김 · RFL</text></g>
    <!-- 퀘스트 마커 -->
    <g transform="translate(890,230)">
