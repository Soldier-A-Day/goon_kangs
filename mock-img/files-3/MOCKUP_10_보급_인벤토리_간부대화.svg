      <rect width="1376" height="60" fill="#191D14" stroke="#333A2B"/>
      <text x="24" y="37" fill="#DFE2D6" font-size="18">"확인해 보겠습니다."</text>
      <text x="1352" y="37" fill="#99A18D" font-size="16" text-anchor="end" font-family="ui-monospace, Menlo, monospace">+1</text>
    </g>
    <g transform="translate(0,144)">
      <rect width="1376" height="60" fill="#191D14" stroke="#333A2B"/>
