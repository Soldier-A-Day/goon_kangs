<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<rect width="1920" height="1080" fill="#0B0D08"/>
<text x="60" y="46" fill="#5E6E42" font-size="12" letter-spacing="3" font-family="ui-monospace, Menlo, monospace">SCREEN 7.9 — 부대 지도 [M]  ·  구역 단위 시야 차단 (1.3-A) 적용 상태</text>

<!-- 패널 -->
<rect x="60" y="70" width="1180" height="940" fill="#12150F"/>
<rect x="60" y="70" width="1180" height="940" fill="none" stroke="#333A2B" stroke-width="2"/>
<rect x="60" y="70" width="1180" height="72" fill="#1B1F17"/>
<rect x="60" y="140" width="1180" height="2" fill="#DFE2D6"/>
<text x="88" y="102" fill="#9AB06F" font-size="12" letter-spacing="2.2" font-family="ui-monospace, Menlo, monospace">BASE MAP</text>
<text x="88" y="128" fill="#DFE2D6" font-size="22" font-weight="800">부대 배치도</text>
<text x="1212" y="112" fill="#9AB06F" font-size="15" text-anchor="end">● 무전 연결 — 아군 마커 표시 중</text>

<!-- ========== 배치도 ========== -->
<g transform="translate(96,176)">
  <!-- 실내동 (좌) -->
