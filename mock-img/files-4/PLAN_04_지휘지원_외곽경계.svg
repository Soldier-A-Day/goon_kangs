  <text x="24" y="30" fill="#5E6E42" font-size="12" letter-spacing="2" font-family="ui-monospace, Menlo, monospace">고증 반영으로 바뀐 것 — 구역 목록 개정</text>
  <text x="24" y="60" fill="#191C16" font-size="14"><tspan font-weight="700">신설 2</tspan>  정문 위병소 · 탄약고(외곽 격리) — 부대 관문과 경계 대상이 없으면 야간 경계 시스템이 성립하지 않는다</text>
  <text x="24" y="88" fill="#191C16" font-size="14"><tspan font-weight="700">흡수 3</tspan>  세탁장 · 사이버지식방 · 체력단련장이 별동에서 생활관동 내부로 — 2004년 이후 통합 추세를 따랐다</text>
  <text x="24" y="116" fill="#191C16" font-size="14"><tspan font-weight="700">이동 1</tspan>  무기고는 생활관동 안, 탄약고는 외곽으로 분리 — 총기와 탄약이 같은 곳에 있지 않다</text>
  <text x="24" y="144" fill="#9E3226" font-size="14" font-weight="700">결과 — 구역 15개에서 18개로. 8.0 미결정 항목 1번(구역 개수 적정성)의 재검토가 필요하다</text>
