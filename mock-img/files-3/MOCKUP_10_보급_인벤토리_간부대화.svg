    <text x="20" y="112" fill="#D2594B" font-size="14">현재 미소지 — 조건 D 위험</text>
    <text x="270" y="136" fill="#9AB06F" font-size="24" font-weight="800" text-anchor="end" font-family="ui-monospace, Menlo, monospace">12</text>
