</g>

<!-- 범례 -->
<g transform="translate(96,806)">
  <rect width="1108" height="1" fill="#333A2B"/>
  <text x="0" y="32" fill="#99A18D" font-size="12" letter-spacing="2" font-family="ui-monospace, Menlo, monospace">LEGEND</text>
  <g font-size="14" fill="#99A18D">
    <rect x="0" y="48" width="20" height="20" fill="#21281A" stroke="#9AB06F" stroke-width="2"/><text x="30" y="63">현재 구역 — 월드 렌더 활성</text>
    <rect x="280" y="48" width="20" height="20" fill="#151810" stroke="#262C1F"/><text x="310" y="63">타 구역 — 스프라이트 미렌더</text>
    <circle cx="600" cy="58" r="8" fill="#EEF1E8"/><text x="618" y="63">같은 구역 아군 — 실시간</text>
    <circle cx="850" cy="58" r="8" fill="none" stroke="#3F6E90" stroke-width="2.5" stroke-dasharray="3 3"/><text x="868" y="63">타 구역 아군 — 무전으로만</text>
  </g>
</g>

<!-- ========== 우측: 무전 3단계 ========== -->
<rect x="1280" y="70" width="580" height="940" fill="#12150F"/>
<rect x="1280" y="70" width="580" height="940" fill="none" stroke="#333A2B" stroke-width="2"/>
<rect x="1280" y="70" width="580" height="72" fill="#1B1F17"/>
<rect x="1280" y="140" width="580" height="2" fill="#DFE2D6"/>
<text x="1308" y="102" fill="#D2594B" font-size="12" letter-spacing="2.2" font-family="ui-monospace, Menlo, monospace">1.3-1  재설계 항목</text>
<text x="1308" y="128" fill="#DFE2D6" font-size="20" font-weight="800">무전 상태 3단계</text>

<!-- 정상 -->
<g transform="translate(1308,176)">
  <rect width="524" height="180" fill="#191D14" stroke="#9AB06F"/>
  <rect width="5" height="180" fill="#9AB06F"/>
  <text x="24" y="34" fill="#9AB06F" font-size="17" font-weight="800">정상</text>
  <text x="500" y="34" fill="#9AB06F" font-size="13" text-anchor="end">배터리 OK · 안테나 OK</text>
  <rect x="24" y="50" width="476" height="90" fill="#12150F"/>
  <g transform="translate(40,62)">
    <g stroke="#333A2B" fill="#1B1F17"><rect width="90" height="30"/><rect x="102" width="60" height="30"/><rect x="174" width="110" height="30"/><rect x="296" width="80" height="30"/><rect x="388" width="56" height="30"/></g>
    <g stroke="#333A2B" fill="#1B1F17" transform="translate(0,40)"><rect width="120" height="26"/><rect x="132" width="150" height="26"/><rect x="294" width="150" height="26"/></g>
    <circle cx="60" cy="16" r="5" fill="#6E7A50"/><circle cx="200" cy="16" r="5" fill="#3F6E90"/>
    <circle cx="330" cy="54" r="5" fill="#EEF1E8"/><circle cx="410" cy="16" r="5" fill="#B08A2C"/>
    <circle cx="200" cy="16" r="12" fill="none" stroke="#7FAECF" stroke-width="1.5" opacity="0.8"/>
  </g>
  <text x="24" y="166" fill="#99A18D" font-size="14">마커 4개 + 퀘스트 핑 + 통신병 지정 핑</text>
</g>

<!-- 약함 -->
<g transform="translate(1308,378)">
