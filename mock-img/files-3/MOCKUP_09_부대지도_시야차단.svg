  <text x="10" y="-8" fill="#5A6053" font-size="12" font-family="ui-monospace, Menlo, monospace">본관동</text>

  <!-- Z01 생활관 (현재 위치 아님, 가시) -->
  <g><rect x="14" y="14" width="180" height="130" fill="#21281A" stroke="#5E6E42"/>
     <text x="26" y="36" fill="#9AB06F" font-size="11" font-family="ui-monospace, Menlo, monospace">Z01</text>
     <text x="26" y="60" fill="#DFE2D6" font-size="16" font-weight="700">생활관</text></g>
  <!-- Z03 -->
