  <text x="24" y="32" fill="#9E3226" font-size="12" letter-spacing="2" font-family="ui-monospace, Menlo, monospace">MASH 4건이 한 구역에 몰려 있다 — 1 · 4 · 5 · 9</text>
  <text x="24" y="60" fill="#191C16" font-size="14">야외 일과가 전부 여기 모이는 탓인데, 공간에 찍어 놓고 보니 <tspan font-weight="700">1번만 성격이 다르다.</tspan></text>
  <text x="24" y="86" fill="#5A6053" font-size="13">제설 · 제초 · 추가작업은 <tspan font-weight="700">면적을 밀어내는 일</tspan>이지만, 배수로 정비는 <tspan font-weight="700">물길을 트는 일</tspan>이다.</text>
  <text x="24" y="112" fill="#5E6E42" font-size="13" font-weight="700">1번을 TRACE(물길 내기)로 돌리면 MASH가 3건으로 줄고, 배수로라는 지형지물도 실제로 쓰인다.</text>
