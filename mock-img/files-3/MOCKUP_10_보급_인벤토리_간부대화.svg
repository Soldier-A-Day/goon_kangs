<text x="352" y="136" fill="#DFE2D6" font-size="24" font-weight="800">보급 청구서</text>
<text x="1420" y="106" fill="#99A18D" font-size="13" text-anchor="end">보급 포인트</text>
<text x="1568" y="136" fill="#9AB06F" font-size="34" font-weight="800" text-anchor="end" font-family="ui-monospace, Menlo, monospace">42</text>
<text x="1420" y="136" fill="#99A18D" font-size="15" text-anchor="end">잔여</text>

<!-- 예보 힌트 (행정병 전용) -->
<g transform="translate(352,178)">
  <rect width="1216" height="70" fill="#191D14" stroke="#B08A2C"/>
  <rect width="5" height="70" fill="#B08A2C"/>
