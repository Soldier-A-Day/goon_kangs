    <text x="20" y="76" fill="#EEF1E8" font-size="15">동상 해제 ×6 · 붕대 ×10</text>
    <text x="20" y="102" fill="#99A18D" font-size="14">의무병 요청</text>
    <text x="270" y="136" fill="#DFE2D6" font-size="24" font-weight="800" text-anchor="end" font-family="ui-monospace, Menlo, monospace">20</text>
