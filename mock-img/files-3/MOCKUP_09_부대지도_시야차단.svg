  <rect width="5" height="180" fill="#DB8B55"/>
  <text x="24" y="34" fill="#DB8B55" font-size="17" font-weight="800">약함</text>
  <text x="500" y="34" fill="#DB8B55" font-size="13" text-anchor="end">배터리 저하 · 안테나 열화</text>
  <rect x="24" y="50" width="476" height="90" fill="#12150F"/>
  <g transform="translate(40,62)" opacity="0.9">
    <g stroke="#333A2B" fill="#1B1F17"><rect width="90" height="30"/><rect x="102" width="60" height="30"/><rect x="174" width="110" height="30"/><rect x="296" width="80" height="30"/><rect x="388" width="56" height="30"/></g>
    <g stroke="#333A2B" fill="#1B1F17" transform="translate(0,40)"><rect width="120" height="26"/><rect x="132" width="150" height="26"/><rect x="294" width="150" height="26"/></g>
    <circle cx="60" cy="16" r="5" fill="#6E7A50" opacity="0.35"/><circle cx="200" cy="16" r="5" fill="#3F6E90"/>
    <circle cx="330" cy="54" r="5" fill="#EEF1E8" opacity="0.35"/><circle cx="410" cy="16" r="5" fill="#B08A2C" opacity="0.35"/>
  </g>
  <text x="24" y="166" fill="#99A18D" font-size="14">1.5초 주기 점멸 · 위치 갱신 3초 지연</text>
</g>

<!-- 두절 -->
<g transform="translate(1308,580)">
  <rect width="524" height="180" fill="#2A1614" stroke="#D2594B" stroke-width="2"/>
  <rect width="5" height="180" fill="#D2594B"/>
  <text x="24" y="34" fill="#D2594B" font-size="17" font-weight="800">두절</text>
  <text x="500" y="34" fill="#D2594B" font-size="13" text-anchor="end">통신병 실패 · 배터리 방전</text>
  <rect x="24" y="50" width="476" height="90" fill="#12150F"/>
  <g transform="translate(40,62)" opacity="0.28">
    <g stroke="#333A2B" fill="#1B1F17"><rect width="90" height="30"/><rect x="102" width="60" height="30"/><rect x="174" width="110" height="30"/><rect x="296" width="80" height="30"/><rect x="388" width="56" height="30"/></g>
    <g stroke="#333A2B" fill="#1B1F17" transform="translate(0,40)"><rect width="120" height="26"/><rect x="132" width="150" height="26"/><rect x="294" width="150" height="26"/></g>
  </g>
  <text x="262" y="112" fill="#D2594B" font-size="16" font-weight="700" text-anchor="middle">● 무전 두절</text>
  <text x="24" y="166" fill="#D2594B" font-size="14">모든 마커 · 핑 소멸 — 걸어가야만 확인 가능</text>
</g>

<!-- 설계 근거 -->
<g transform="translate(1308,782)">
  <rect width="524" height="1" fill="#333A2B"/>
  <text x="0" y="34" fill="#9AB06F" font-size="12" letter-spacing="2" font-family="ui-monospace, Menlo, monospace">왜 이 화면이 필요한가</text>
  <text x="0" y="66" fill="#DFE2D6" font-size="15">3D는 벽이 시야를 가려 무전 두절이 압박이 됐다.</text>
  <text x="0" y="92" fill="#DFE2D6" font-size="15">2D 탑다운은 화면 안이 전부 보이므로</text>
  <text x="0" y="118" fill="#D2594B" font-size="15" font-weight="700">그대로 옮기면 통신병 보직이 무의미해진다.</text>
  <text x="0" y="156" fill="#99A18D" font-size="15">해결 = 구역 밖 스프라이트 미렌더(A)</text>
  <text x="0" y="182" fill="#99A18D" font-size="15">＋ 미니맵 마커를 무전에 게이팅(C)</text>
  <rect x="0" y="200" width="524" height="1" fill="#333A2B"/>
  <text x="0" y="230" fill="#DB8B55" font-size="14">M1에서 반드시 검증 — M3로 미루면 되돌릴 수 없음</text>
</g>
