  <text x="24" y="56" fill="#DFE2D6" font-size="18">D-10 <tspan fill="#7FAECF" font-weight="700">극혹한 −14°C</tspan> · 기상 악화 확정 — 방한 우선</text>
  <text x="1192" y="52" fill="#D2594B" font-size="15" text-anchor="end">이 정보를 분대장에게 말해야 결정이 된다</text>
</g>

<!-- 품목 카드 -->
<g transform="translate(352,272)">
