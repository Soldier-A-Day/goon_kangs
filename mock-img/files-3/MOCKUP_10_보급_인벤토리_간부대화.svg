    <text x="20" y="76" fill="#DB8B55" font-size="15">열원 유지 3일분</text>
    <text x="20" y="102" fill="#D2594B" font-size="14">포인트 부족</text>
    <text x="266" y="136" fill="#D2594B" font-size="24" font-weight="800" text-anchor="end" font-family="ui-monospace, Menlo, monospace">16</text>
  </g>
