    <rect x="6" y="18" width="34" height="4" fill="#3D4629"/><rect x="10" y="22" width="26" height="16" fill="#C9A183"/>
    <rect x="0" y="40" width="46" height="48" fill="#5A6440"/>
    <rect x="4" y="46" width="8" height="10" fill="#E0D8B0"/>
    <rect x="8" y="88" width="12" height="26" fill="#33352E"/><rect x="26" y="88" width="12" height="26" fill="#33352E"/>
  </g>
  <rect x="0" y="70" width="1920" height="300" fill="#0B0D08" opacity="0.35"/>

  <!-- 대화 패널 1440×400 하단 -->
  <rect x="240" y="380" width="1440" height="400" fill="#12150F"/>
  <rect x="240" y="380" width="1440" height="400" fill="none" stroke="#333A2B" stroke-width="2"/>
  <rect x="240" y="380" width="1440" height="66" fill="#1B1F17"/>
  <rect x="240" y="444" width="1440" height="2" fill="#DFE2D6"/>
  <text x="272" y="422" fill="#DFE2D6" font-size="21" font-weight="800">행보관</text>
  <text x="392" y="421" fill="#99A18D" font-size="15">보급 · 정비를 중시</text>
  <text x="1508" y="412" fill="#99A18D" font-size="13" text-anchor="end">신뢰도</text>
  <rect x="1330" y="418" width="200" height="14" fill="#262C1F"/>
  <rect x="1330" y="418" width="128" height="14" fill="#9AB06F"/>
  <text x="1648" y="426" fill="#9AB06F" font-size="20" font-weight="800" text-anchor="end" font-family="ui-monospace, Menlo, monospace">64</text>

  <text x="272" y="500" fill="#DFE2D6" font-size="19">"난로 유류가 이틀치밖에 안 남았다던데. 내일 한파라며?"</text>

  <!-- 선택지 -->
  <g transform="translate(272,536)">
    <g>
      <rect width="1376" height="60" fill="#191D14" stroke="#9AB06F"/>
      <rect width="4" height="60" fill="#9AB06F"/>
      <text x="24" y="37" fill="#DFE2D6" font-size="18">"오늘 청구서에 올렸습니다. 포인트가 모자라 우선순위를 조정했습니다."</text>
      <text x="1352" y="37" fill="#9AB06F" font-size="16" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, monospace">+6</text>
    </g>
