        <text x="18" y="30" fill="#9AB06F" font-size="13">외피</text><text x="18" y="54" fill="#DFE2D6" font-weight="700">방상외피</text>
        <text x="382" y="30" fill="#7FAECF" text-anchor="end" font-weight="700" font-family="ui-monospace, Menlo, monospace">보온 +9</text>
