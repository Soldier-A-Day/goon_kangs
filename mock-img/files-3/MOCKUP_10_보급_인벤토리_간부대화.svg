<!-- ══════════ 3 : 간부 대화 ══════════ -->
<g transform="translate(0,1500)">
  <text x="60" y="46" fill="#5E6E42" font-size="12" letter-spacing="3" font-family="ui-monospace, Menlo, monospace">SCREEN 7.10-C — DISC-02  간부 대화  ·  석식 · 개인정비 시간대에만</text>

  <!-- 월드 상단 (의무실 배경) -->
  <rect x="0" y="70" width="1920" height="300" fill="#1B2119"/>
  <g fill="#232B20"><rect x="200" y="110" width="260" height="200"/><rect x="1400" y="110" width="300" height="200"/></g>
  <g transform="translate(880,150) scale(1.6)">
