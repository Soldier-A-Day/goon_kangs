      <text y="-16" fill="#7FAECF" font-size="12" text-anchor="middle">최 · COM</text>
    </g>
    <g transform="translate(860,388)">
      <circle r="8" fill="none" stroke="#B08A2C" stroke-width="2.5" stroke-dasharray="3 3"/>
      <text y="-16" fill="#B08A2C" font-size="12" text-anchor="middle">박 · ADM</text>
    </g>
