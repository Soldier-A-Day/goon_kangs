<!-- ══════════ 1 : 보급 청구 ══════════ -->
<text x="60" y="46" fill="#5E6E42" font-size="12" letter-spacing="3" font-family="ui-monospace, Menlo, monospace">SCREEN 7.10-A — SUP-01  보급 청구  ·  행정병만 작성</text>

<rect x="320" y="70" width="1280" height="640" fill="#12150F"/>
<rect x="320" y="70" width="1280" height="640" fill="none" stroke="#333A2B" stroke-width="2"/>
